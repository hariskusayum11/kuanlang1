# SKL-FRIS — Production/Test deploy (VPS)
# ใช้บน VPS: วางไฟล์นี้ + .env.production ในโฟลเดอร์เดียวกัน
# แล้วรัน:  docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# db ไม่ publish port ออก host — เข้าถึงได้เฉพาะผ่าน network ภายในของ compose (app -> db)
# app publish 3000 ออก host ให้ reverse proxy/ผู้ทดสอบเข้าถึง
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: skl_db
    restart: unless-stopped
    environment:
      # เขตเวลาประเทศไทย — กันเวลาที่บันทึกใน DB คลาดเคลื่อนจากเวลาเครื่อง
      TZ: Asia/Bangkok
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - skl_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    # ตั้ง IMAGE ใน .env.production เป็น <dockerhub-user>/skl-fris:v1
    image: ${IMAGE}
    container_name: skl_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # ใช้สร้างลิงก์ในอีเมล (ยืนยันอีเมล/ตั้งรหัสผ่านใหม่)
      # ไม่ตั้งค่า = ใช้โดเมนจริง กันลิงก์ในเมลชี้ localhost
      # ถ้าเข้าใช้งานผ่าน IP:3000 ต้อง override ให้ตรงกับ URL ที่เปิดจริง
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://khuanlangmodel.com}
      # เปิด/ปิดระบบอีเมลทั้งระบบ (Owner Decision 2026-10-17)
      # ไม่ตั้งค่า = เปิด — ต้องประกาศ false ชัดเจนจึงจะปิด (ดู .env.production.example)
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      SEARCH_HASH_KEY: ${SEARCH_HASH_KEY}
      # seed ข้อมูลหลัก (ตำบล/ชุมชน/ตัวเลือกในแบบสอบถาม/เบอร์ฉุกเฉิน)
      # ค่าเริ่มต้น true เพราะ seed เป็น upsert รันซ้ำปลอดภัย
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      - "3000:3000"

volumes:
  skl_db_data:
