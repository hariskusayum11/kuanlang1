# SKL-FRIS — Development Database (local only)
# ⚠️ Development เท่านั้น — ห้ามใช้ credential ชุดนี้กับ Production
# ห้ามเปิด database สู่ public network (bind localhost ผ่าน port mapping ด้านล่างเท่านั้น)
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: kuanlang_dev_db
    restart: unless-stopped
    environment:
      # เขตเวลาประเทศไทย — กันเวลาที่บันทึกใน DB คลาดเคลื่อนจากเวลาเครื่อง dev
      TZ: Asia/Bangkok
      POSTGRES_USER: kuanlang
      POSTGRES_PASSWORD: kuanlang_dev_password
      POSTGRES_DB: kuanlang_dev
    ports:
      - "5432:5432"
    volumes:
      - kuanlang_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuanlang -d kuanlang_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kuanlang_dev_data:
